
# Leantime 3.12.0 - Host bind-mount deployment
#
# Database and application files reside under /srv/leantime.
# HTTP is accessible only through the host loopback interface.

services:

  # 
  # MySQL 8.4
  # 
  leantime_db:
    image: mysql:8.4
    container_name: mysql_leantime
    restart: unless-stopped
    stop_grace_period: 60s

    env_file:
      - ./.env

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - type: bind
        source: /srv/leantime/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false

    networks:
      - leantime-net

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 30s
      timeout: 10s
      retries: 3

  # 
  # Leantime 3.12.0
  # 
  leantime:
    image: leantime/leantime:3.12.0
    restart: unless-stopped

    env_file:
      - ./.env

    security_opt:
      - no-new-privileges:true

    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID

    ports:
      - "127.0.0.1:${LEAN_PORT:-18081}:8081"

    networks:
      - leantime-net

    volumes:
      - type: bind
        source: /srv/leantime/userfiles
        target: /var/www/html/userfiles
        bind:
          create_host_path: false

      - type: bind
        source: /srv/leantime/public_userfiles
        target: /var/www/html/public/userfiles
        bind:
          create_host_path: false

      - type: bind
        source: /srv/leantime/plugins
        target: /var/www/html/app/Plugins
        bind:
          create_host_path: false

      - type: bind
        source: /srv/leantime/logs
        target: /var/www/html/storage/logs
        bind:
          create_host_path: false

    depends_on:
      leantime_db:
        condition: service_healthy

  # 
  # Leantime MCP server
  # 
  leantime_mcp:
    image: local/leantime-mcp:0.2.0
    restart: unless-stopped

    env_file:
      - ./mcp.env

    networks:
      - leantime-net

    ports:
      - "127.0.0.1:13000:3000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    depends_on:
      leantime:
        condition: service_started


# 
# Internal Docker network
# 
networks:
  leantime-net:

